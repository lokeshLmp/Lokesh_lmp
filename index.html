<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO-POINT | Waste is a Planning Failure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        leaf: '#A8D5BA',
                        'leaf-dark': '#7AB893',
                        forest: '#4A7C59',
                        'forest-dark': '#2F5039',
                        cream: '#F8F4E6',
                        sand: '#EDE4D4',
                        earth: '#D9CDBD',
                        sprout: '#C4E4B5',
                        lime: '#B5E61D',
                        moss: '#8ABF7A',
                        wilt: '#F4D03F',
                        spoil: '#E74C3C'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['DM Serif Display', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'leaf-fade': 'leafFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slow-float': 'float 8s ease-in-out infinite',
                        'pulse-soft': 'pulseSoft 3s ease-in-out infinite',
                    },
                    keyframes: {
                        leafFade: {
                            '0%': { opacity: '0', transform: 'translateY(15px) scale(0.98)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.7' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8F4E6; /* cream */
            color: #2F5039; /* forest-dark */
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
        }
        .dark body {
            background-color: #1a2a1f; /* Custom dark deep forest */
            color: #F8F4E6;
        }
        .brightness-overlay {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: black;
            mix-blend-mode: multiply;
            transition: opacity 0.3s ease;
        }
        .leaf-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 10c-10 0-20 10-20 20s10 20 20 20 20-10 20-20-10-20-20-20z' fill='%234A7C59' fill-opacity='0.03'/%3E%3C/svg%3E");
        }
        .glass-morphism {
            background: rgba(248, 244, 230, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(74, 124, 89, 0.1);
        }
        .dark .glass-morphism {
            background: rgba(47, 80, 57, 0.8);
            border: 1px solid rgba(248, 244, 230, 0.05);
        }
        ::selection {
            background-color: #B5E61D;
            color: #2F5039;
        }
        /* Custom scrollbar for organic feel */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #F8F4E6;
        }
        ::-webkit-scrollbar-thumb {
            background: #4A7C59;
            border-radius: 5px;
            border: 2px solid #F8F4E6;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="leaf-pattern font-sans">
    <div id="root"></div>
</body>
</html>
